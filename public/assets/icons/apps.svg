<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Apps icon — four color tiles</title>
  <desc id="desc">Rounded square container with four rounded tiles in red, blue, green, and yellow. Designed as a generic apps indicator for Orkut-style sidebars.</desc>
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
  </defs>

  <!-- container card -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#card)" stroke="#e3e8f3" stroke-width="3" filter="url(#shadow)"/>

  <!-- grid tiles -->
  <g transform="translate(76,76)">
    <!-- row 1 -->
    <rect x="0"   y="0"   width="160" height="160" rx="32" fill="#F44336"/>  <!-- red -->
    <rect x="200" y="0"   width="160" height="160" rx="32" fill="#2196F3"/>  <!-- blue -->
    <!-- row 2 -->
    <rect x="0"   y="200" width="160" height="160" rx="32" fill="#4CAF50"/>  <!-- green -->
    <rect x="200" y="200" width="160" height="160" rx="32" fill="#FFC107"/>  <!-- yellow -->
  </g>

  <!-- subtle shine -->
  <path d="M84,84 C220,40 420,40 492,180 L492,120 C492,68 450,28 396,28 L116,28 C96,28 78,36 64,50 C60,80 66,94 84,84 Z" fill="#fff" opacity="0.5"/>
</svg>